<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="./images/favicon-32x32.png"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | QR code component</title>
</head>

<body class="min-vh-100 d-flex flex-column">
  <main class="container flex-grow-1">
    <div class="row h-100 justify-content-center align-items-center py-4">
      <div class="col-11 col-sm-auto">
        <div class="card qr-card border-0 rounded-4 shadow text-center p-3 pb-4">
          <img
            class="card-img-top img-fluid rounded-3"
            src="./images/image-qr-code.png"
            alt="QR code that links to Frontend Mentor"
          >

          <div class="card-body px-2 pt-4 pb-2">
            <h1 class="card-title qr-title fw-bold mb-3">
              Improve your front-end skills by building projects
            </h1>

            <p class="card-text qr-text px-1 mb-0">
              Scan the QR code to visit Frontend Mentor and take your
              coding skills to the next level
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="attribution text-center px-3 pb-4">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>.
    Coded by
    <a href="https://github.com/ricardoe7">
      Ricardo
    </a>.
  </footer>
</body>
</html>
