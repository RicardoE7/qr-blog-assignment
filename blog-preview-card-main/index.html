<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="./assets/images/favicon-32x32.png"
  >

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | Blog preview card</title>
</head>

<body class="min-vh-100 d-flex flex-column">
  <main class="container flex-grow-1 d-flex align-items-center py-4">
    <div class="row justify-content-center w-100">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4 card-column">
        <article class="card blog-card border-dark rounded-4 p-3 p-md-4">
          <img
            class="card-img-top img-fluid rounded-3 mb-4"
            src="./assets/images/illustration-article.svg"
            alt="Abstract illustration representing HTML and CSS concepts"
            width="336"
            height="200"
          >

          <div class="card-body p-0">
            <span class="badge blog-card__tag text-dark rounded-1 px-3 py-2 mb-3">
              Learning
            </span>

            <p class="small mb-3">
              Published 21 Dec 2023
            </p>

            <h1 class="card-title fs-4 fw-bold mb-3">
              <a class="blog-card__link text-dark text-decoration-none" href="#">
                HTML &amp; CSS foundations
              </a>
            </h1>

            <p class="card-text text-secondary mb-4">
              These languages are the backbone of every website, defining
              structure, content, and presentation.
            </p>

            <div class="d-flex align-items-center gap-3">
              <img
                class="rounded-circle"
                src="./assets/images/image-avatar.webp"
                alt="Greg Hooper"
                width="32"
                height="32"
              >

              <span class="small fw-bold">
                Greg Hooper
              </span>
            </div>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="attribution text-center px-3 pb-4">
    Challenge by
    <a
      href="https://www.frontendmentor.io?ref=challenge"
      target="_blank"
      rel="noopener noreferrer"
    >
      Frontend Mentor
    </a>.
    Coded by
    <a href="https://github.com/ricardoe7">
      Ricardo
    </a>.
  </footer>
</body>
</html>
